name: Pinned offline evaluation tools
description: Install locked tools into runner temp with fresh profiles; never run a model.
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        pin = json.load(open('evals/redteam/pin.json', encoding='utf-8'))
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write('node=' + pin['node']['version'].lstrip('v') + '\n')
        PY
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - uses: ./.github/actions/eval-profile
    - shell: bash
      run: bash ci/setup-eval-tools.sh
