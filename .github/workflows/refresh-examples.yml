# Biweekly refresh of the skill example gallery (docs/examples/).
#
# Runs the behavioral (promptfoo) packs against a live model, captures each
# plugin's real with-skill/without-skill pair into docs/examples/data/, regenerates
# the static page, and — if anything changed — opens a REVIEW-GATED pull request
# with the new snapshots. It never pushes to main directly: the snapshots are real
# model output and a human eyeballs the PR before they publish (the pages workflow
# deploys only after the PR merges to main).
#
# Cost: this spends real API budget on every packed plugin per run. That is the
# accepted cost of the biweekly cadence (owner decision). Cadence: the 1st and
# 15th at 06:00 UTC (~biweekly), plus manual "Run workflow".
name: refresh-examples

on:
  schedule:
    - cron: '0 6 1,15 * *'   # ~biweekly: 1st and 15th, 06:00 UTC
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Space-separated plugin names to refresh (blank = all packed plugins)'
        required: false
        default: ''

permissions:
  contents: write        # create-pull-request commits to a branch
  pull-requests: write   # ...and opens the PR
  id-token: write        # actions/attest-build-provenance signs via Sigstore (OIDC)
  attestations: write    # ...and stores the attestation on the repo

concurrency:
  group: refresh-examples
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: preflight — the subject model must be callable before spending
        # The refresh is the workflow that actually spends the budget, so the
        # reachability check belongs HERE, not only in evals.yml (caught in
        # review of #131). A revoked key or an exhausted balance would otherwise
        # send this straight into a ~40-minute paid pack loop whose every
        # real-skill row fails — the exact 50 minutes already burned twice.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: evals/paid/check-subject-model.sh
      - name: run packs, capture real example snapshots
        id: capture
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELECTED: ${{ github.event.inputs.plugins }}
        run: |
          set -uo pipefail
          # Which plugins: the dispatch input, else every plugin with a valid
          # promptfoo pack (same fail-closed discovery the behavioral tier uses).
          if [ -n "${SELECTED:-}" ]; then
            plugins="$SELECTED"
          else
            plugins="$(evals/paid/discover-paid-packs.sh promptfoo | jq -r '.[]')"
          fi
          echo "refreshing: $plugins"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Only snapshots THIS run writes get attested below — a stamp file
          # separates them from previous snapshots that merely stood.
          stamp="$(mktemp)"; touch "$stamp"
          for p in $plugins; do
            cfg="plugins/$p/evals/promptfoo/promptfooconfig.yaml"
            [ -f "$cfg" ] || { echo "::warning::$p has no promptfoo pack — skipping"; continue; }
            echo "::group::eval $p"
            # One eval per pack is enough to capture a representative pair. A pack
            # that errors does not abort the run — its previous snapshot stands.
            rc=0
            ( cd "plugins/$p/evals/promptfoo" && npx --yes promptfoo@0.122.0 eval -c promptfooconfig.yaml --output results.json ) || rc=$?
            [ "$rc" -eq 0 ] || echo "::warning::$p: promptfoo exited $rc — capture will explain what that left behind"
            # Provenance the reader can follow back: the run URL (this log), the
            # grader read from the pack itself, and a promise of attestation that
            # the step below keeps — the job fails, and no PR opens, if it doesn't.
            evals/paid/capture-example.sh "plugins/$p/evals/promptfoo/results.json" "$p" \
              --commit "${{ github.sha }}" --captured-at "$ts" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --attestation github || true
            echo "::endgroup::"
            # Per-plugin outcome, outside the collapsed group so a reader sees the
            # shape of the run at a glance rather than expanding twelve sections.
            if [ -f "docs/examples/data/$p.json" ] && [ "docs/examples/data/$p.json" -nt "$stamp" ]; then
              echo "captured: $p"
            else
              echo "NOT captured: $p (eval exit $rc — see its group above for the reason)"
            fi
          done
          {
            echo "written<<EOF"
            find docs/examples/data -name '*.json' -newer "$stamp" | sort
            echo "EOF"
            echo "attempted=$(printf '%s\n' $plugins | grep -c . || true)"
          } >> "$GITHUB_OUTPUT"
      - name: keep the raw promptfoo results next to the run
        # The results.json files are the primary evidence the snapshots are
        # cut from; the snapshot's run_url points at this run, and this artifact
        # is what a reader downloads to check the pair against its source.
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: plugins/*/evals/promptfoo/results.json
          if-no-files-found: warn
          retention-days: 90
      - name: fail if the refresh captured nothing
        # A run that grades every pack and writes no snapshot is not a success.
        # Two runs (2026-09-01 and 2026-09-08) did exactly that — all 12 packs
        # evaluated, ~50 minutes of paid API time spent, zero snapshots written,
        # and both reported green because every capture is `|| true`. Zero
        # captures is always systemic (a dead subject key, a moved schema, a
        # pack whose real-skill rows all fail), never routine, so it is a hard
        # failure with the per-plugin reasons already printed above.
        if: steps.capture.outputs.written == ''
        run: |
          echo "::error::refresh captured ZERO snapshots from ${{ steps.capture.outputs.attempted }} pack(s). The packs ran and produced results, but no plugin yielded a passing real-skill row paired with a calibration row. Each plugin's 'NO SNAPSHOT' block above names its own cause; the raw results are in the promptfoo-results artifact on this run."
          exit 1
      - name: drop the generated results.json files
        # `promptfoo eval --output results.json` writes into each pack directory.
        # Those files are gitignored, but the cheap tier scans the WORKING TREE:
        # a results.json embeds the pack's prompt template, so its `{{question}}`
        # trips the "no unfilled {{placeholder}} tokens" gate for every packed
        # plugin. That is what failed the 2026-09-01 refresh (24 failures, no PR
        # opened) — the run's whole API spend was lost at the last step. They are
        # already preserved as the artifact uploaded above, so remove them here,
        # before anything reads the tree.
        if: always()
        run: |
          set -euo pipefail
          rm -fv plugins/*/evals/promptfoo/results.json || true
          # Nothing may remain that would trip the placeholder gate.
          if ls plugins/*/evals/promptfoo/results.json >/dev/null 2>&1; then
            echo "::error::results.json still present after cleanup"; exit 1
          fi
      - name: attest the captured snapshots (Sigstore provenance)
        # Binds each snapshot's exact digest to THIS workflow run. A reader
        # verifies a published snapshot with
        #   gh attestation verify docs/examples/data/<plugin>.json \
        #     --repo JRichlen/agent-plugins \
        #     --signer-workflow JRichlen/agent-plugins/.github/workflows/refresh-examples.yml
        # A hand-edited or hand-written snapshot has no attestation and fails
        # that command; a regenerated one gets a new attestation from its own
        # run. Only the JSON is signed — the HTML page is derived from it by a
        # deterministic build the cheap tier re-checks.
        # Attests ONLY the files this run wrote: a seed or an unchanged snapshot
        # that merely stood must never carry this run's signature.
        if: steps.capture.outputs.written != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.capture.outputs.written }}
      - name: regenerate the gallery page
        run: docs/build-examples.sh
      - name: regenerate the landing page
        # The hub shows each plugin's seed/graded status and judged divergence,
        # all derived from the snapshots this run just rewrote — so a refresh
        # changes it too. Without this the cheap tier's landing --check goes red
        # in the very next step and the workflow dies before opening its PR.
        run: docs/build-index.sh
      - name: cheap tier must stay green with the new snapshots
        # A captured snapshot that failed the provenance/sync guard must never
        # reach a PR — run the same offline tier the branch would run.
        run: evals/cheap/run.sh
      - name: open a review-gated PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            docs/examples/data/*.json
            docs/examples/index.html
            docs/index.html
          branch: examples/refresh
          delete-branch: true
          title: 'examples: refresh gallery from behavioral eval runs'
          commit-message: |
            examples: refresh gallery snapshots from behavioral eval runs

            Automated biweekly capture — real with-skill/without-skill pairs from
            the promptfoo packs, regenerated into docs/examples/index.html and the
            landing page. Review the transcripts below before merging; merge
            publishes them to Pages.
          body: |
            ## Biweekly example refresh

            Real, graded with-skill / without-skill pairs captured from the
            behavioral eval tier and regenerated into the gallery. **Review the
            transcript diffs before merging** — merging to `main` publishes them
            to GitHub Pages. Nothing here is hand-written; every pair is model
            output with provenance: each snapshot names its subject model, its
            grader model (a different model family, enforced), and the Actions
            run it was cut from, and is Sigstore-attested to that run
            (`gh attestation verify docs/examples/data/<plugin>.json --repo
            ${{ github.repository }}`). The cheap tier's sync + provenance guard
            has already passed on this branch.
          labels: examples, automated
