# Calibration sheet — issue #102, measurement 2.
#
# Draws a BLIND labelling sheet from a finished subject-matrix (or behavioral)
# run's results artifact, using evals/paid/calibration/sample-for-labelling.py,
# and commits the sheet plus the grader's verdicts to a calibration/<run-id>
# branch so a human can label the sheet in a pull request. The verdicts file is
# written base64-encoded so it cannot be read by accident while labelling;
# agreement.py decodes it (see evals/paid/calibration/README.md).
#
# The branch is based on the COMMIT THAT PRODUCED THE RUN (recorded in the results artifact), not
# on the ref this workflow was dispatched from, so the pack rubric next to the
# sheet is the one the grader actually applied to those verdicts. The sampling
# script itself is taken from the dispatch ref, so a newer sampler can be
# pointed at an older run.
#
# Manual dispatch only; no model calls; never a required check.
name: calibration sheet
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id that produced the results artifact (a subject-matrix run: artifact subject-matrix-<pack>; a behavioral run: promptfoo-results-<pack>).'
        required: true
        type: string
      packs:
        description: 'Plugin names, comma-separated.'
        required: true
        type: string
      n:
        description: 'Rows per pack.'
        required: false
        default: '20'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  sheet:
    name: calibration sheet — draw and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate the dispatch inputs
        id: inputs
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          PACKS: ${{ github.event.inputs.packs }}
          N: ${{ github.event.inputs.n }}
        run: |
          set -euo pipefail
          python3 - <<'PYINPUT'
          import os, re
          def positive(name, digits):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9]{1,%d}" % digits, value) or int(value) < 1:
                  raise SystemExit(f"{name} must be a positive decimal integer")
              return int(value)
          run_id, n = positive("RUN_ID", 20), positive("N", 4)
          packs = list(dict.fromkeys(p.strip() for p in os.environ["PACKS"].split(",")))
          if not packs or any(p in ("", ".", "..") or not re.fullmatch(r"[A-Za-z0-9._-]+", p) for p in packs):
              raise SystemExit("packs must be comma-separated plain plugin names")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run_id={run_id}\nn={n}\nseed={run_id % 2147483647}\npacks={' '.join(packs)}\n")
          PYINPUT
      - name: download the results artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        run: |
          set -euo pipefail
          branch="refs/heads/calibration/$RUN_ID"
          existing="$(git ls-remote --heads origin "$branch")"
          [ -z "$existing" ] || { echo "::error::calibration/$RUN_ID already exists; preserve its labels"; exit 1; }
          root="$(mktemp -d "$RUNNER_TEMP/calibration.XXXXXX")"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          for p in $PACKS; do
            got=""
            for kind in subject-matrix promptfoo-results; do
              dest="$root/$p/$kind"
              mkdir -p "$dest"
              if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$kind-$p" -D "$dest"; then
                got="$kind"; break
              fi
            done
            [ -n "$got" ] || { echo "::error::no results artifact for $p on run $RUN_ID"; exit 1; }
            printf '%s\n' "$got" > "$root/$p/kind"
          done
      - name: verify artifact provenance
        id: source
        env:
          ROOT: ${{ steps.artifacts.outputs.root }}
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        run: |
          set -euo pipefail
          python3 - <<'PYPROVENANCE'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["ROOT"])
          shas, attempts = set(), set()
          for pack in os.environ["PACKS"].split():
              kind = (root / pack / "kind").read_text().strip()
              filename = {"subject-matrix": "results.matrix.json", "promptfoo-results": "results.json"}[kind]
              directory = root / pack / kind
              result, provenance = directory / filename, directory / "provenance.json"
              if any(p.is_symlink() for p in directory.rglob("*")):
                  raise SystemExit(f"{pack}: artifact contains symlinks")
              if not result.is_file() or not provenance.is_file():
                  raise SystemExit(f"{pack}: missing results or checkout provenance; legacy artifacts are unsupported, rerun the producer")
              if set(directory.rglob("results*.json")) != {result}:
                  raise SystemExit(f"{pack}: ambiguous results files")
              meta = json.loads(provenance.read_text())
              if (meta.get("repository") != os.environ["GITHUB_REPOSITORY"] or
                  meta.get("run_id") != os.environ["RUN_ID"] or
                  meta.get("pack") != pack or meta.get("result") != filename or
                  meta.get("sha256") != hashlib.sha256(result.read_bytes()).hexdigest() or
                  not re.fullmatch(r"[0-9a-f]{40}", str(meta.get("checkout_sha", ""))) or
                  not re.fullmatch(r"[1-9][0-9]*", str(meta.get("run_attempt", "")))):
                  raise SystemExit(f"{pack}: invalid or mismatched provenance")
              shas.add(meta["checkout_sha"])
              attempts.add(meta["run_attempt"])
              (root / pack / "result-path").write_text(str(result))
          if len(shas) != 1 or len(attempts) != 1:
              raise SystemExit("selected artifacts have different checkout revisions or run attempts")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={shas.pop()}\n")
          PYPROVENANCE
      - name: check out the recorded source revision
        env:
          SHA: ${{ steps.source.outputs.sha }}
          ROOT: ${{ steps.artifacts.outputs.root }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        run: |
          set -euo pipefail
          cp evals/paid/calibration/sample-for-labelling.py "$ROOT/sample-for-labelling.py"
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$SHA"
          git checkout --detach "$SHA"
          for p in $PACKS; do
            # Validate against the source tree, including all output ancestors.
            for d in plugins "plugins/$p" "plugins/$p/evals" "plugins/$p/evals/promptfoo" "plugins/$p/evals/promptfoo/calibration"; do
              [ ! -L "$d" ] || { echo "::error::symlink in calibration output path: $d"; exit 1; }
            done
            [ -d "plugins/$p/evals/promptfoo" ] || { echo "::error::pack $p does not exist at $SHA"; exit 1; }
          done
      - name: draw the blind sheets
        env:
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
          N: ${{ steps.inputs.outputs.n }}
          SEED: ${{ steps.inputs.outputs.seed }}
          ROOT: ${{ steps.artifacts.outputs.root }}
        run: |
          set -euo pipefail
          seed="$SEED"
          for p in $PACKS; do
            f="$(cat "$ROOT/$p/result-path")"
            d="plugins/$p/evals/promptfoo/calibration"; mkdir -p "$d"
            python3 "$ROOT/sample-for-labelling.py" "$f" --n "$N" --seed "$seed" \
              --sheet "$d/$RUN_ID.sheet.json" --verdicts "$ROOT/$p/verdicts.json"
            base64 -w0 "$ROOT/$p/verdicts.json" > "$d/$RUN_ID.verdicts.b64"
            echo "### calibration sheet — $p (run $RUN_ID, seed $seed)" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$d/$RUN_ID.sheet.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys, collections
          s = json.load(open(sys.argv[1]))
          c = collections.Counter(r["scenario"] for r in s)
          print(f"\n{len(s)} rows across {len(c)} scenarios; labels blank.\n")
          for k, v in sorted(c.items()): print(f"- {v} × {k[:90]}")
          PY
          done
      - name: commit the sheets to a calibration branch
        env:
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          SHA: ${{ steps.source.outputs.sha }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        run: |
          set -euo pipefail
          branch="calibration/$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" "$SHA"
          for p in $PACKS; do
            git add -- "plugins/$p/evals/promptfoo/calibration/$RUN_ID.sheet.json" "plugins/$p/evals/promptfoo/calibration/$RUN_ID.verdicts.b64"
          done
          git commit -m "calibration: blind sheets drawn from run $RUN_ID (labels blank; verdicts base64-sealed)" \
            -m "Based on $SHA, the commit that produced run $RUN_ID, so the pack rubric beside each sheet is the one that graded these verdicts."
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          echo "branch: $branch (based on $SHA)" >> "$GITHUB_STEP_SUMMARY"
