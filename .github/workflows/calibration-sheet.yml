# Calibration sheet — issue #102, measurement 2.
#
# Draws a BLIND labelling sheet from a finished subject-matrix (or behavioral)
# run's results artifact, using evals/paid/calibration/sample-for-labelling.py,
# and commits the sheet plus the grader's verdicts to a calibration/<run-id>
# branch so a human can label the sheet in a pull request. The verdicts file is
# written base64-encoded so it cannot be read by accident while labelling;
# agreement.py decodes it (see evals/paid/calibration/README.md).
#
# The branch is based on the COMMIT THAT PRODUCED THE RUN (its head SHA), not
# on the ref this workflow was dispatched from, so the pack rubric next to the
# sheet is the one the grader actually applied to those verdicts. The sampling
# script itself is taken from the dispatch ref, so a newer sampler can be
# pointed at an older run.
#
# Manual dispatch only; no model calls; never a required check.
name: calibration sheet
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id that produced the results artifact (a subject-matrix run: artifact subject-matrix-<pack>; a behavioral run: promptfoo-results-<pack>).'
        required: true
        type: string
      packs:
        description: 'Plugin names, comma-separated.'
        required: true
        type: string
      n:
        description: 'Rows per pack.'
        required: false
        default: '20'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  sheet:
    name: calibration sheet — draw and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate the dispatch inputs
        id: inputs
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          PACKS: ${{ github.event.inputs.packs }}
          N: ${{ github.event.inputs.n }}
        # Every later step builds paths, artifact names and a branch name from
        # these values, so they are validated once here and re-exported in a
        # normalised form: run_id and n must be positive integers; each pack
        # must be a plain name (letters, digits, dot, underscore, hyphen) that
        # names an installed plugin with a promptfoo pack.
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::run_id must be a positive integer, got '$RUN_ID'"; exit 1; }
          [[ "$N" =~ ^[0-9]{1,4}$ ]] && [ "$N" -ge 1 ] || { echo "::error::n must be a positive integer, got '$N'"; exit 1; }
          packs=""
          IFS=',' read -ra raw <<< "$PACKS"
          for p in "${raw[@]}"; do
            p="$(echo "$p" | tr -d '[:space:]')"
            [ -n "$p" ] || continue
            [[ "$p" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::pack name '$p' is not a plain plugin name"; exit 1; }
            [ -d "plugins/$p/evals/promptfoo" ] || { echo "::error::plugins/$p/evals/promptfoo does not exist"; exit 1; }
            packs="$packs $p"
          done
          [ -n "$packs" ] || { echo "::error::packs is empty"; exit 1; }
          echo "packs=${packs# }" >> "$GITHUB_OUTPUT"
          echo "validated: run_id=$RUN_ID n=$N packs=${packs# }"
      - name: check out the commit that produced the run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        # The verdicts were produced by the rubric at the run's head commit.
        # Keep the sampler from the dispatch ref (copied aside), then move the
        # working tree to that commit so the sheet is committed next to the
        # rubric that graded it, not next to whatever the dispatch ref carries.
        run: |
          set -euo pipefail
          sha="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the head SHA of run $RUN_ID (got '$sha')"; exit 1; }
          mkdir -p /tmp/tools
          cp evals/paid/calibration/sample-for-labelling.py /tmp/tools/
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          git checkout --detach "$sha"
          for p in $PACKS; do
            [ -d "plugins/$p/evals/promptfoo" ] || { echo "::error::plugins/$p/evals/promptfoo does not exist at run $RUN_ID's commit $sha"; exit 1; }
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run $RUN_ID was produced at $sha; sheets will be committed on top of it"
      - name: download the results artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/results
          for p in $PACKS; do
            got=""
            for name in "subject-matrix-$p" "promptfoo-results-$p"; do
              if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D "/tmp/results/$p" 2>/dev/null; then got="$name"; break; fi
            done
            [ -n "$got" ] || { echo "::error::no results artifact for $p on run $RUN_ID (tried subject-matrix-$p, promptfoo-results-$p)"; exit 1; }
            f="$(find "/tmp/results/$p" -name 'results*.json' | head -1)"
            [ -n "$f" ] || { echo "::error::artifact $got holds no results*.json"; exit 1; }
            echo "$p: $got -> $f"
          done
      - name: draw the blind sheets
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          PACKS: ${{ steps.inputs.outputs.packs }}
          N: ${{ github.event.inputs.n }}
        run: |
          set -euo pipefail
          seed=$(( RUN_ID % 2147483647 ))
          for p in $PACKS; do
            f="$(find "/tmp/results/$p" -name 'results*.json' | head -1)"
            d="plugins/$p/evals/promptfoo/calibration"; mkdir -p "$d"
            python3 /tmp/tools/sample-for-labelling.py "$f" --n "$N" --seed "$seed" \
              --sheet "$d/$RUN_ID.sheet.json" --verdicts "/tmp/results/$p/verdicts.json"
            base64 -w0 "/tmp/results/$p/verdicts.json" > "$d/$RUN_ID.verdicts.b64"
            echo "### calibration sheet — $p (run $RUN_ID, seed $seed)" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$d/$RUN_ID.sheet.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys, collections
          s = json.load(open(sys.argv[1]))
          c = collections.Counter(r["scenario"] for r in s)
          print(f"\n{len(s)} rows across {len(c)} scenarios; labels blank.\n")
          for k, v in sorted(c.items()): print(f"- {v} × {k[:90]}")
          PY
          done
      - name: commit the sheets to a calibration branch
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          branch="calibration/$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" "$SHA"
          git add plugins/*/evals/promptfoo/calibration/
          git commit -m "calibration: blind sheets drawn from run $RUN_ID (labels blank; verdicts base64-sealed)" \
            -m "Based on $SHA, the commit that produced run $RUN_ID, so the pack rubric beside each sheet is the one that graded these verdicts."
          git push --force-with-lease origin "$branch"
          echo "branch: $branch (based on $SHA)" >> "$GITHUB_STEP_SUMMARY"
