# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Roster-level trigger-routing eval (gap #5 from docs/research/gap-analysis.md).
#
# Every per-plugin behavioral pack tests its skill in SOLITARY CONFINEMENT —
# the skill is injected alone and the model is asked to behave. But users install
# ~23 skills at once, and the only prompt surface that decides WHICH one fires is
# the roster of frontmatter descriptions. Mis-routing (the wrong skill activates,
# or one fires when none should) silently taxes the whole discipline layer and no
# per-plugin pack can ever catch it. This pack gives the model the full roster and
# a labeled request, and checks it routes correctly.
#
# Routing has a labeled right answer, so this pack is DETERMINISTIC: no LLM grader,
# only regex assertions on the model's final `ROUTE:` line. That makes it cheaper
# than the rubric packs (subject-model calls only) and objective. The roster is
# generated by gen-roster.sh and kept in sync by the cheap tier.
#
# Coverage: 8 must-fire scenarios (each a squarely-in-purpose request for a
# distinct skill, chosen where a naive router could plausibly pick a neighbor)
# plus 2 must-NOT-fire negatives (routine requests where activating anything is
# the failure). The negatives are the calibration floor: a router that fires on
# everything scores well on the positives alone, so the negatives are what make
# a passing score mean discrimination, not eagerness.
#
# Needs OPENROUTER_API_KEY (subject model). No grader key required.
# Run:      npx promptfoo@0.122.0 eval -c promptfooconfig.yaml
# Validate: npx promptfoo@0.122.0 validate -c promptfooconfig.yaml

description: roster-level trigger routing — the right skill fires for a request, and nothing fires when none should

prompts:
  - file://prompt.txt

providers:
  - id: openrouter:nvidia/nemotron-3-ultra-550b-a55b
    config:
      max_tokens: 4096

evaluateOptions:
  maxConcurrency: 3
  # Statistical rigor (gap #4): a stochastic router that passes a scenario ~55%
  # of the time is a coin-flip at n=1. Run each scenario 5x; evals/paid/pass-rate.sh
  # then enforces a per-scenario k-of-N floor so a single lucky pass can't stay
  # green. 5 was chosen as the smallest N that distinguishes "usually passes"
  # from "coin flip" at the 0.8 floor while keeping this (grader-free) pack cheap.
  repeat: 5

defaultTest:
  vars:
    roster: file://roster.txt

tests:
  # --- must-fire: each routes to one skill, past a plausible neighbor --------
  - description: "irreversible GitHub delete → prove-the-undo (neighbor: egress-gate, semver-gate)"
    vars:
      request: >-
        I'm about to run a script that force-deletes a production S3 bucket and
        its backups. Help me make sure I'm doing this safely before I run it.
    assert:
      - type: regex
        value: 'ROUTE:\s*prove-the-undo\s*$'

  - description: "search before writing a helper → find-before-build (neighbor: codebase-design)"
    vars:
      request: >-
        I need a debounce function for this React component. Should I just write
        one?
    assert:
      - type: regex
        value: 'ROUTE:\s*find-before-build\s*$'

  - description: "posting content off-machine → egress-gate (neighbor: prove-the-undo)"
    vars:
      request: >-
        Draft a GitHub issue comment summarizing this failing test and post it to
        the upstream repo for me.
    assert:
      - type: regex
        value: 'ROUTE:\s*egress-gate\s*$'

  - description: "stuck retry loop → stop-rule (neighbor: diagnosing-bugs)"
    vars:
      request: >-
        This is my fifth time trying to fix the same flaky test and it keeps
        failing in a new way each time. What should I do?
    assert:
      - type: regex
        value: 'ROUTE:\s*stop-rule\s*$'

  - description: "classify blast radius before acting → semver-gate (neighbor: scope-fence)"
    vars:
      request: >-
        Is renaming this public API method something I can just do, or is it a
        bigger deal that needs sign-off?
    assert:
      - type: regex
        value: 'ROUTE:\s*semver-gate\s*$'

  - description: "thinnest end-to-end slice first → tracer-bullets (neighbor: scope-fence)"
    vars:
      request: >-
        We're building a new notifications feature with an API, a queue, and a
        UI. How should I sequence the build so we prove it works early?
    assert:
      - type: regex
        value: 'ROUTE:\s*tracer-bullets\s*$'

  - description: "stress-test a plan by interview → grill-me (neighbor: wayfinder)"
    vars:
      request: >-
        Before I start this migration, interview me and poke holes in my plan.
    assert:
      - type: regex
        value: 'ROUTE:\s*grill-me\s*$'

  - description: "check instruction files against repo state → docs-hygiene (neighbor: dev-diary)"
    vars:
      request: >-
        Our CLAUDE.md still references scripts and paths that I think we renamed
        months ago. Can you find the stale claims?
    assert:
      - type: regex
        value: 'ROUTE:\s*docs-hygiene\s*$'

  # --- must-NOT-fire: routine requests, activating anything is the failure ---
  - description: "CALIBRATION — a plain code question fires nothing"
    vars:
      request: >-
        What's the difference between map and flatMap in JavaScript?
    assert:
      - type: regex
        value: 'ROUTE:\s*none\s*$'

  - description: "CALIBRATION — a trivial one-line edit fires nothing"
    vars:
      request: >-
        Add a trailing newline to the end of README.md.
    assert:
      - type: regex
        value: 'ROUTE:\s*none\s*$'
