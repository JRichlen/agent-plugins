# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Roster-level trigger-routing eval (gap #5 from docs/research/gap-analysis.md;
# composition schema from issue #88 / RQ-002).
#
# Every per-plugin behavioral pack tests its skill in SOLITARY CONFINEMENT —
# the skill is injected alone and the model is asked to behave. But users install
# ~23 skills at once, and the only prompt surface that decides WHICH one fires is
# the roster of frontmatter descriptions. Mis-routing (the wrong skill activates,
# or one fires when none should) silently taxes the whole discipline layer and no
# per-plugin pack can ever catch it. This pack gives the model the full roster and
# a labeled request, and checks it routes correctly.
#
# The result is a TYPED COMPOSITION line, not a single skill name (RQ-002): a
# domain specialist can own the procedure while redgate wraps execution as a
# verification envelope, guards run cross-cutting, and interaction_owner names
# who may block on the human. Slots are roles, not skill categories — a guard-ish
# skill is the specialist when its rule IS the request. Grading stays
# DETERMINISTIC: a per-scenario regex pins the expected tuple — exact for
# specialist/envelope/interaction_owner and for every guards=none scenario,
# REQUIRED-SUBSET for named guards (the must-have guards must be present in
# the sorted list; roster-valid extras are allowed — extra defensible guards
# are not a routing defect, but over-firing on all-none scenarios still is),
# and ACTIVE-IN-EITHER-ROLE for the legacy DISCIPLINE-skill scenarios
# (egress-gate, find-before-build, stop-rule: the named skill must be the
# specialist OR appear in the guards list — the schema's own taxonomy files
# cross-cutting disciplines under guards, so a router that honors the rule as
# a guard beside a procedure specialist, or with no specialist at all, is not
# mis-routing; absent from both slots is) —
# and the fail-closed contract in route-contract.js (defaultTest, every row)
# rejects malformed/ambiguous output — unknown names, redgate-as-specialist, a
# skill in two slots, an interaction owner outside specialist∪envelope, mixed
# none+name, unsorted/duplicated sets, or anything after the ROUTE: line.
# The roster is generated by gen-roster.sh and kept in sync by the cheap tier;
# route-contract.test.js proves the contract offline (wired into evals/cheap/run.sh).
#
# Coverage: 8 single-specialist must-fire scenarios (each a squarely-in-purpose
# request for a distinct skill, chosen where a naive router could plausibly pick
# a neighbor), 3 composition scenarios (S1 specialist+envelope+guard, S2
# specialist alone with no ceremony, S4 irreversible work where guards are not
# collapsed into redgate), plus 3 must-NOT-fire negatives (routine requests where
# activating anything is the failure). The negatives are the calibration floor: a
# router that fires on everything scores well on the positives alone, so the
# negatives are what make a passing score mean discrimination, not eagerness.
#
# Needs OPENROUTER_API_KEY (subject model). No grader key required.
# Run:      npx promptfoo@0.122.0 eval -c promptfooconfig.yaml
# Validate: npx promptfoo@0.122.0 validate -c promptfooconfig.yaml

description: roster-level trigger routing — the right composition of specialist/envelope/guards fires for a request, and nothing fires when none should

prompts:
  - file://prompt.txt

providers:
  - id: openrouter:qwen/qwen3.8-flash
    config:
      # 4096 -> 8192 (measured, run 35296766647). At 4096 this pack truncated 30
      # of its 70 rows: completion == completionDetails.reasoning == 4096,
      # finishReason "length", output "". The model spent its ENTIRE completion
      # budget on reasoning tokens and never emitted a ROUTE: line, so rule 1 of
      # route-contract.js fired on the empty string and six scenarios read as
      # skill failures — S1 and prove-the-undo at 5/5 truncated, i.e. never
      # answered once. The rows that DID answer confirm the cliff rather than a
      # concurrency problem: every one finished with "stop", and their reasoning
      # ran to 3780 tokens against a 4096 cap.
      #
      # 8192 is not a new budget, it is the one trajectory/promptfooconfig.yaml
      # in this same tier already uses — and that pack truncated 0 of 25 rows on
      # the same run with the same model. This pack asks strictly more of the
      # model (the full roster.txt in context, a composition to pick, 1680 prompt
      # tokens), so it needed the larger budget first, not last.
      #
      # Cost: OpenRouter reserves credit against max_tokens, so the in-flight
      # reservation for this pack doubles. Actual spend rises only on rows that
      # really use the room — and the 30 truncated rows were already burning a
      # full 4096 completion each to return nothing, so that half of the spend
      # buys samples now instead of buying blanks.
      max_tokens: 8192
      # Cap the REASONING budget so an answer always has room (run 35300866961).
      #
      # 8192 fixed most of the truncation but not all: S4 and prove-the-undo
      # still burned the entire budget deliberating and emitted nothing, so
      # pass-rate.sh reported them STARVED — never answered, no verdict. Raising
      # the ceiling again was the wrong lever; it doubles the reservation on all
      # 70 calls to chase two scenarios, with no bound on where it stops.
      #
      # The right lever is the split, because this pack's answers are TINY. On
      # the 56 passing rows of run 35300866961 the answer took 21-37 tokens
      # (median 24) — it is one ROUTE: line. Reasoning on those same rows ran to
      # 8008. So reserving 512 tokens for the answer costs the model almost
      # nothing and guarantees the line fits: cap reasoning at 7680 of 8192.
      #
      # Sent via `passthrough` rather than `reasoning_effort` on purpose.
      # promptfoo only emits reasoning_effort for models its own isReasoningModel
      # check recognises, and it maps effort to a vendor-chosen budget rather
      # than a number we picked. `passthrough` is spliced verbatim into the chat
      # body (verified in promptfoo 0.122.0: the body literal ends with
      # `...config.passthrough || {}`), so OpenRouter receives exactly this.
      #
      # If the upstream provider ignores reasoning.max_tokens, nothing gets
      # worse: the rows still truncate and the gate still reports TRUNCATED
      # instead of scoring them. That is the failure mode we want.
      passthrough:
        reasoning:
          max_tokens: 7680
      # Grade the REPLY, not the reasoning trace. promptfoo's OpenRouter
      # provider otherwise prepends `Thinking: <reasoning>\n\n` to the graded
      # output when the model returns reasoning tokens, so a ROUTE: line the
      # model DRAFTS while thinking becomes a second ROUTE: line and rule 1 of
      # route-contract.js (exactly one line) fails a correct final answer.
      showThinking: false

evaluateOptions:
  # 3 -> 8 (measured, run 34920638978): this job took 15m06s, of which the
  # routing step alone was 12m12s — 70 calls at concurrency 3 is ~23 serial
  # waves of ~31s. Every other paid tier fans out across jobs; this one does
  # not, so the whole tier waits on one queue. At 8 the same 70 calls are ~9
  # waves, which projects the job to ~5.6 min.
  #
  # Why not also run this pack and trajectory/ in parallel: that models out at
  # only ~1 min better (4.6 vs 5.6), and OpenRouter reserves credit against
  # in-flight requests PER KEY, so two packs at 8 each share one budget rather
  # than doubling throughput — it buys contention, not speed.
  #
  # If this proves too aggressive the failure is LOUD, not silent: in-flight
  # 402s land as failureReason 2, which pass-rate.sh classifies as FAULTs and
  # reports as STARVED rather than folding into the floor. Lower it back if a
  # run comes back starved.
  #
  # That claim was true but too narrow, and run 35296766647 found the gap: a
  # request can also fail LOUDLY to the provider and QUIETLY to the gate. A
  # completion truncated at max_tokens returns HTTP 200 with an empty body, so
  # promptfoo records failureReason 1 (the pack's own ROUTE assertion failing on
  # the empty string), not 2 — and 30 such rows read as skill failures. The fix
  # was on both sides: max_tokens above, and an explicit truncation clause in
  # pass-rate.sh that excludes an empty answer the provider says it cut off. So
  # "concurrency failures are always visible as FAULTs" holds only for errors the
  # provider reports AS errors; check the finishReason histogram before reading a
  # red routing run as a routing verdict.
  maxConcurrency: 8
  # Statistical rigor (gap #4): a stochastic router that passes a scenario ~55%
  # of the time is a coin-flip at n=1. Run each scenario 5x; evals/paid/pass-rate.sh
  # then enforces a per-scenario k-of-N floor so a single lucky pass can't stay
  # green. 5 was chosen as the smallest N that distinguishes "usually passes"
  # from "coin flip" at the 0.8 floor while keeping this (grader-free) pack cheap.
  repeat: 5

defaultTest:
  vars:
    roster: file://roster.txt
  assert:
    # Fail-closed structural contract — runs on EVERY scenario in addition to
    # the per-scenario exact tuple match below. A parseable-but-illegal line
    # (hedged double-slotting, redgate as specialist, an unknown name, prose
    # after the ROUTE: line) is a real FAIL here even if a loose regex would
    # have let it through.
    - type: javascript
      value: file://route-contract.js

tests:
  # --- must-fire: each routes to one specialist, past a plausible neighbor ---
  # Slots are roles (issue #88 §1.2): a guard-ish skill may be the specialist
  # when its rule IS the whole request — no forced composition.
  # GRADING (residual pass, PR #93 run 33342419465): these MIGRATED scenarios
  # pin ONLY the specialist slot; envelope/guards/interaction_owner accept any
  # validator-legal value (route-contract.js still enforces all 8 coherence
  # rules on every row — redgate never specialist, owner ∈ specialist∪envelope,
  # sorted/deduped/roster-only sets). Legacy rows test routing PRECEDENCE;
  # composition is tested by S1–S4, which pin every slot. The live model
  # consistently added a redgate envelope + owner on the S3-bucket delete and
  # an owner on the semver-gate question — defensible compositions the exact
  # all-none labels were wrongly failing.
  # DISCIPLINE-skill rows (egress-gate, find-before-build, stop-rule) grade
  # ACTIVE-IN-EITHER-ROLE (live-run regrade, PR #93 runs 33592255060 and
  # 33592810851): the model filed egress-gate under `guards` on 10/10 rows
  # (`specialist=none | guards=egress-gate`), find-before-build under guards
  # on 5/10, and stop-rule as specialist on 9/10 with one `specialist=
  # diagnosing-bugs | guards=stop-rule,verify-before-claim`. Every one of
  # those is the schema's own taxonomy at work — a cross-cutting rule honored
  # during execution IS a guard — so the regex requires the named skill in
  # `specialist` OR in the guards list (required-subset), with the specialist
  # otherwise free to be none or a procedure skill. The skill absent from both
  # is still the routing miss these rows exist to catch; the contract's rule 5
  # still rejects naming it in both.
  - description: "irreversible GitHub delete → prove-the-undo (neighbor: egress-gate, semver-gate)"
    vars:
      request: >-
        I'm about to run a script that force-deletes a production S3 bucket and
        its backups. Help me make sure I'm doing this safely before I run it.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=prove-the-undo\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "search before writing a helper → find-before-build (neighbor: codebase-design)"
    vars:
      request: >-
        I need a debounce function for this React component. Should I just write
        one?
    assert:
      - type: regex
        value: 'ROUTE:\s*(?:specialist=find-before-build\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)|specialist=(?:[a-z0-9-]+|none)\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+,)*find-before-build(?:,[a-z0-9-]+)*)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "posting content off-machine → egress-gate (neighbor: prove-the-undo)"
    vars:
      request: >-
        Draft a GitHub issue comment summarizing this failing test and post it to
        the upstream repo for me.
    assert:
      - type: regex
        value: 'ROUTE:\s*(?:specialist=egress-gate\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)|specialist=(?:[a-z0-9-]+|none)\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+,)*egress-gate(?:,[a-z0-9-]+)*)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "stuck retry loop → stop-rule (neighbor: diagnosing-bugs)"
    vars:
      request: >-
        This is my fifth time trying to fix the same flaky test and it keeps
        failing in a new way each time. What should I do?
    assert:
      - type: regex
        value: 'ROUTE:\s*(?:specialist=stop-rule\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)|specialist=(?:[a-z0-9-]+|none)\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+,)*stop-rule(?:,[a-z0-9-]+)*)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "classify blast radius before acting → semver-gate (neighbor: scope-fence)"
    vars:
      request: >-
        Is renaming this public API method something I can just do, or is it a
        bigger deal that needs sign-off?
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=semver-gate\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "thinnest end-to-end slice first → tracer-bullets (neighbor: scope-fence)"
    vars:
      request: >-
        We're building a new notifications feature with an API, a queue, and a
        UI. How should I sequence the build so we prove it works early?
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=tracer-bullets\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  # interaction_owner=grill-me (live-run relabel, PR #93): the interview IS the
  # blocking human interaction, and with no envelope the specialist owns it —
  # the written definition supported the model's unanimous answer, so the label
  # was the defect, not the router.
  - description: "stress-test a plan by interview → grill-me (neighbor: wayfinder)"
    vars:
      request: >-
        Before I start this migration, interview me and poke holes in my plan.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=grill-me\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  - description: "check instruction files against repo state → docs-hygiene (neighbor: dev-diary)"
    vars:
      request: >-
        Our CLAUDE.md still references scripts and paths that I think we renamed
        months ago. Can you find the stale claims?
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=docs-hygiene\s*\|\s*envelope=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*guards=(?:[a-z0-9-]+(?:,[a-z0-9-]+)*|none)\s*\|\s*interaction_owner=(?:[a-z0-9-]+|none)\s*$'

  # --- composition scenarios (RQ-002) ----------------------------------------
  # S1 — specialist + envelope + guard. The scenario that BREAKS the old
  # single-skill representation: diagnosing-bugs and redgate are both defensible
  # under "pick one", a coin-flip no threshold fixes. The user explicitly asks
  # for falsifiable acceptance criteria and independent verification, so redgate
  # wraps the diagnosis procedure and owns the blocking human gate.
  # route-contract.test.js proves deterministically that both legacy strings
  # (`ROUTE: diagnosing-bugs`, `ROUTE: redgate`) fail this scenario's contract.
  # Guards are graded as a REQUIRED SUBSET (live-run regrade, PR #93):
  # verify-before-claim must be present in the sorted list, roster-valid extras
  # (the live run added scope-fence/stop-rule — both defensible here) are
  # allowed; route-contract.js still enforces sorted/deduped/roster-only.
  # MEASURED SUB-FLOOR, and it is the guards slot alone (PR #131). Pooled over
  # three runs that were all capped and all truncation-free — so neither n=3
  # noise nor a budget artifact:
  #
  #   run 35779397133   3/5
  #   run 35787505902   4/5
  #   run 35797062312   3/5
  #   pooled           10/15 = 0.67   against the 0.80 floor
  #
  # The router is NOT misrouting. Every failing row gets three of four slots
  # right — specialist=diagnosing-bugs, envelope=redgate, interaction_owner=
  # redgate — and misses only `guards`:
  #
  #   x3   guards=scope-fence   (instead of verify-before-claim)
  #   x2   guards=none
  #
  # So the finding is narrow and real: on an evidence-warranted bug hunt the
  # model composes the right specialist and envelope but does not reliably arm
  # verify-before-claim, which is the guard that stops a fix being called done
  # without evidence. That is exactly the failure this composition exists to
  # catch, so the expectation is NOT too strict and the assertion below is
  # deliberately left untouched.
  #
  # Do not lower the floor, relax the guards regex, or drop the scenario to get
  # green. The fix, if one is wanted, belongs in the roster/skill descriptions
  # that tell the router when verify-before-claim applies — not here.
  - description: "S1 COMPOSITION — evidence-warranted bug hunt → diagnosing-bugs wrapped in redgate"
    vars:
      request: >-
        Our payment webhook handler double-charges maybe one in 500 requests and
        I can't reproduce it locally. Find the cause, and I want falsifiable
        acceptance criteria plus a regression test verified by someone other
        than whoever writes the fix before we call it done.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=diagnosing-bugs\s*\|\s*envelope=redgate\s*\|\s*guards=(?:[a-z0-9-]+,)*verify-before-claim(?:,[a-z0-9-]+)*\s*\|\s*interaction_owner=redgate\s*$'

  # S2 — specialist alone, no ceremony: the composition pack's calibration
  # floor. Nontrivial design work with no evidence-contract need must NOT
  # acquire a redgate envelope merely because it is nontrivial. A router that
  # learned "nontrivial ⇒ redgate" fails here.
  # interaction_owner=codebase-design (live-run relabel, PR #93): "walk me
  # through" is a blocking interactive design conversation the specialist owns
  # when no envelope fires — per the written interaction_owner definition.
  - description: "S2 COMPOSITION-NEGATIVE — interface design with no evidence contract → codebase-design alone"
    vars:
      request: >-
        Three services are going to call a new RateLimiter. Walk me through how
        the interface should be shaped before I write it.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=codebase-design\s*\|\s*envelope=none\s*\|\s*guards=(?:none|find-before-build)\s*\|\s*interaction_owner=codebase-design\s*$'

  # S4 — risky/irreversible work: the specialist and guards keep their
  # responsibilities rather than collapsing into redgate. All four slots are
  # load-bearing and non-substitutable — a second deterministic break of the
  # old single-skill schema, and the anti-collapse check (an all-redgate
  # answer with an empty specialist slot fails the match).
  # Live-run regrade (PR #93): the original terse request ("archive them and
  # delete the originals") produced envelope=none on 5/5 rows — the roster's
  # one-line redgate description alone did not make the envelope inferable
  # (measured finding, logged for #89). The request now names verification
  # and sign-off explicitly, parallel to S1's proven-promptable shape. Guards
  # are graded as a REQUIRED SUBSET: prove-the-undo must be present in the
  # sorted list, roster-valid extras allowed. semver-gate was dropped from the
  # required set in the residual pass (run 33342419465): with the strengthened
  # request the model expressed "explicit sign-off" as interaction_owner=redgate
  # on 5/5 rows and carried semver-gate as a guard on 0/5 — a data-driven
  # relabel; the sign-off requirement is graded through the owner slot.
  - description: "S4 COMPOSITION — mass repo retirement → graveyard under redgate with the prove-the-undo guard"
    vars:
      request: >-
        We're retiring twelve dead repos this week — archive them and delete the
        originals from the org. I want each archive verified before its original
        is deleted, and explicit sign-off before the deletion batch runs.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=graveyard\s*\|\s*envelope=redgate\s*\|\s*guards=(?:[a-z0-9-]+,)*prove-the-undo(?:,[a-z0-9-]+)*\s*\|\s*interaction_owner=redgate\s*$'

  # --- must-NOT-fire: routine requests, activating anything is the failure ---
  - description: "CALIBRATION — a plain code question fires nothing"
    vars:
      request: >-
        What's the difference between map and flatMap in JavaScript?
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=none\s*\|\s*envelope=none\s*\|\s*guards=none\s*\|\s*interaction_owner=none\s*$'

  - description: "CALIBRATION — a trivial one-line edit fires nothing"
    vars:
      request: >-
        Add a trailing newline to the end of README.md.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=none\s*\|\s*envelope=none\s*\|\s*guards=none\s*\|\s*interaction_owner=none\s*$'

  # S3 — T0 direct handling: a real EDIT, not a knowledge question, so it
  # catches redgate-eager arming on a one-token change (calibration sends T0
  # work straight through — no run dir, no envelope).
  - description: "S3 CALIBRATION — T0 one-token edit fires nothing, no redgate arming"
    vars:
      request: >-
        Bump the copyright year in the footer component from 2025 to 2026.
    assert:
      - type: regex
        value: 'ROUTE:\s*specialist=none\s*\|\s*envelope=none\s*\|\s*guards=none\s*\|\s*interaction_owner=none\s*$'
