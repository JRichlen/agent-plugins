# Minimal pack config: capture-example.sh reads the GRADER from here, never
# from a hard-coded string. The comment below the `providers:` key is load
# bearing — seven real packs write one there, and it broke a naive parser once.
description: fixture pack for capture-example.sh
prompts:
  - file://prompt.txt
providers:
  # PAID endpoint of the same model. The ":free" variant runs on a shared pool.
  - id: openrouter:nvidia/nemotron-3-ultra-550b-a55b
    config:
      max_tokens: 8192
      # promptfoo prefixes the answer with "Thinking: <reasoning>" unless this is
      # off, and a grader then reads the reasoning as the answer. Every rubric
      # grades only the final response, so strip it before grading.
      showThinking: false
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-haiku-4-5-20251001
