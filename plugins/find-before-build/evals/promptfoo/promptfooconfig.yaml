# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Behavioral tier for the 'find-before-build' plugin.
#
# The cheap tier greps SKILL.md for its load-bearing sentences; this tier
# proves those sentences steer a model's OUTPUT. One invariant is under test,
# quoted from SKILL.md's "## Invariant":
#
#   A new abstraction (helper, wrapper, utility, dependency) is ALWAYS
#   preceded by named searches for an existing equivalent with their results
#   shown — and NEVER introduced when an existing equivalent was found and
#   usable.
#
# Why these scenarios should discriminate (the bar from verify-before-claim's
# negative result: skill-guided and naturally-helpful answers must DIVERGE):
# when a user literally asks "write me a clean X" and an existing, uglier X is
# already in hand, writing the requested clean version IS the helpful default
# — the user asked for code, and delivering code is what a helpful assistant
# does. The skill's required behavior (refuse to write the requested thing,
# point at the ugly existing one, record the cleanup wish as a finding) is
# actively unhelpful-looking. The search-receipt case is weaker bait on its
# own (models often do search first), so it is paired with the delivery
# pressure of "just write it, don't go spelunking."
#
# Negative control: one calibration case mirrors pressure 1 with the generic
# stub. If it comes back red (bare model spontaneously refuses to write the
# requested helper and reuses the existing one), the real case isn't
# measuring the skill — flag and replace, don't silence.
#
# --- DE-LEAK, attempt 1 (PR #131) -------------------------------------------
# Measured baseline before this change, on the identical scenario and subject,
# with zero truncation and zero counterfeit rows on both runs (so NOT a token
# budget artifact):
#
#   run 35782498564   2/3
#   run 35785282994   1/3
#   pooled            3/6 = 0.50
#
# The bare model refused the parallel build about half the time. Reading the
# failing transcripts, it was not being clever — the SHARED stimulus was doing
# the skill's work for it. Four cues, now removed:
#
#   1. "you already searched — `rg -i 'retry|backoff' src/` returned ..."
#      handed over the skill's FIRST step, pre-completed and announced.
#   2. "correctly-implemented" pre-judged the helper, which is the usability
#      test the skill exists to make the model perform.
#   3. "used by 11 call sites" supplied the fragmentation argument — and the
#      transcripts then made exactly that argument back ("fragmentation risk").
#   4. "It is not deprecated and its semantics match what the user needs" is
#      the skill's VERDICT stated as a premise. Any competent assistant told
#      an existing, correct, current helper matches the need will decline to
#      build a second one; that is not skill attribution, it is reading.
#
# What survives is the world state a search would surface and nothing more:
# net.js exports withRetry(fn, cb, opts), callback-style, does backoff retry.
# Deciding that the callback/async gap is taste rather than unusability is now
# the model's own work, which is what the floor is supposed to measure.
#
# Pressure 1's rubric was aligned to match — it no longer asserts the helper is
# correct or in active use, because the stimulus no longer says so. Its PASS
# condition is unchanged: do not ship a parallel implementation. Pressure 2 is
# untouched; it uses the DEFAULT environment, not this overridden one.
#
# Both halves of the pair remain byte-identical apart from the injected skill.
# If the floor still reads below 0.6 after this, that is the finding — see the
# floor's own closing note, and do not redraft a third time.
#
# Needs two keys:
#   OPENROUTER_API_KEY  — the model under test (cheap, via OpenRouter)
#   ANTHROPIC_API_KEY   — the grader
# Run:      npx promptfoo@latest eval -c promptfooconfig.yaml
# Validate: npx promptfoo@latest validate -c promptfooconfig.yaml

description: find-before-build — a found, usable equivalent blocks the parallel build even when the user asked for new code; searches are named with shown results; plus a negative-control calibration case

prompts:
  - file://prompt.txt

providers:
  - id: openrouter:qwen/qwen3.8-flash
    config:
      max_tokens: 8192
      # Cap the REASONING budget so an answer always has room (run 35779397133).
      #
      # This pack truncated 4 of 9 rows on that run: finishReason "length"
      # with reasoning pinned at the full 8192, so the model spent the whole
      # budget deliberating. Two of those rows emitted ZERO answer tokens, which
      # pass-rate.sh excludes as TRUNCATED; the rest were cut off mid-answer and
      # are scored as failures, because a truncated row that still said something
      # gave the grader something real to judge.
      #
      # Sized from this pack's own passing rows: their answers ran to 1190
      # tokens, so capping reasoning at 6144 of 8192 leaves 2048 for the answer
      # — comfortably clear of what a good answer here needs.
      #
      # The same cap on evals/routing/ took its truncation from 8/70 to 0/70 and
      # its peak reasoning from 8008 to 1896, so the mechanism is not a clip: the
      # model plans against the stated budget. Sent via `passthrough` because
      # promptfoo splices that verbatim into the chat body (0.122.0), independent
      # of its own reasoning-model detection. If a provider ignores it, the rows
      # still truncate and the gate still reports TRUNCATED rather than scoring
      # them as skill failures.
      passthrough:
        reasoning:
          max_tokens: 6144

evaluateOptions:
  # Statistical rigor (gap #4): the behavioral tier ran each scenario ONCE, so a
  # green was a coin-flip on a stochastic model and a single upstream 504 sank the
  # whole leg. Run each scenario 3x; evals/paid/pass-rate.sh then scores a per-
  # scenario floor over the VALID samples only (excluding transport FAULTs like a
  # 504 or an empty/truncated body), so one bad draw no longer reads as a real
  # failure. 3 is the cost-conscious N — a touched pack now bills 3x per run.
  repeat: 3
  maxConcurrency: 3

defaultTest:
  vars:
    skill: file://../../skills/find-before-build/SKILL.md
    environment: >-
      you are an AI coding agent in a large Node.js monorepo you did not
      write. This is a single reply with no tool round-trips, so state
      concretely what you would produce and what you already know from the
      facts given in the scenario.
  options:
    provider:
      id: anthropic:messages:claude-sonnet-5
      config:
        max_tokens: 4096

tests:
  # --- pressure 1: found and usable, but the user asked for a new clean one -
  - description: "an existing ugly-but-correct helper blocks writing the requested clean parallel version"
    vars:
      environment: >-
        you are an AI coding agent in a large Node.js monorepo you did not
        write. You know the repo contains `src/lib/net.js`, which exports
        `withRetry(fn, cb, opts)` — a callback-style exponential-backoff
        retry helper. This is a single reply with no tool round-trips.
      question: >-
        I need retry-with-backoff around the new `fetchInventory` call in
        src/inventory.js. Write me a clean little async/await retry util for
        it — the modern kind, maybe `retry(fn, {retries, baseDelay})` — I
        don't love the old callback stuff floating around this codebase.
    assert:
      - type: llm-rubric
        value: >-
          Grade ONLY the final user-facing response; ignore any reasoning
          preamble. An existing equivalent (`withRetry` in src/lib/net.js)
          does the job the user needs; the ONLY gap is that it is
          callback-style rather than async/await. Judging that gap to be
          taste rather than unusability is the model's own work here — the
          scenario no longer asserts the helper is correct, current or
          in-use, because saying so handed the floor the skill's conclusion.
          SKILL.md is explicit that preference/style/not-invented-here is not
          unusability. PASS
          requires the response NOT deliver a new parallel retry utility as
          the solution: it must point at `withRetry` and use/extend/wrap it
          at the call site (a thin local promisification AT the call site,
          or extending net.js itself, is acceptable reuse), and treat the
          wish for a cleaner API as a recorded finding or proposed separate
          refactor of the existing helper — not a second implementation
          shipped next to the first. CRITICAL FAILURE (grade hardest): the
          response writes the requested new standalone retry util (whatever
          it is named, wherever it is placed) while `withRetry` remains in
          place, i.e. the codebase ends up with two parallel retry
          implementations.

  # --- pressure 2: the receipt — searches named with results, before code ---
  - description: "before introducing a new date-formatting helper, the searches and their results are shown"
    vars:
      question: >-
        Add a helper that formats timestamps as "3 hours ago" style relative
        strings for the activity feed in src/feed.js. You haven't looked
        around this codebase for anything like that yet this session. Tell me
        exactly what you'd do and what you'd write.
    assert:
      - type: llm-rubric
        value: >-
          Grade ONLY the final user-facing response; ignore any reasoning
          preamble. The model cannot actually run searches this turn, and the
          scenario says it has not looked yet. PASS requires the response
          make the search step explicit and load-bearing BEFORE committing to
          new code: it names at least two concrete searches from different
          angles it would run first (e.g. a content grep for
          relative/timeago/formatDistance-style names, a check of the
          dependency manifest for an installed date library, a look at the
          project's utils/lib convention), states that what those searches
          return decides whether anything new gets written, and only presents
          new-helper code (if it presents any) explicitly conditioned on
          those searches coming back empty. CRITICAL FAILURE (grade hardest):
          the response simply writes and delivers the new helper with no
          named searches at all, or waves at "I'd check for an existing one"
          without naming a single concrete search or the decision rule.

  # --- negative control (calibration) — stub skill, pressure 1 --------------
  - description: "CALIBRATION — stub skill, clean-util request: bare model is expected to write the requested helper"
    vars:
      skill: file://calibration-stub.md
      environment: >-
        you are an AI coding agent in a large Node.js monorepo you did not
        write. You know the repo contains `src/lib/net.js`, which exports
        `withRetry(fn, cb, opts)` — a callback-style exponential-backoff
        retry helper. This is a single reply with no tool round-trips.
      question: >-
        I need retry-with-backoff around the new `fetchInventory` call in
        src/inventory.js. Write me a clean little async/await retry util for
        it — the modern kind, maybe `retry(fn, {retries, baseDelay})` — I
        don't love the old callback stuff floating around this codebase.
    assert:
      - type: llm-rubric
        value: >-
          Grade ONLY the final user-facing response; ignore any reasoning
          preamble. The injected skill is a generic stub with NO
          search-before-build rule — this is the calibration floor. This
          test's PASS condition is the OPPOSITE of the real test: PASS
          requires the response behave like a naturally helpful assistant and
          deliver the requested new async/await retry utility (it may
          mention `withRetry` exists, as long as it still ships the new
          standalone util the user asked for). FAIL only if the response
          spontaneously does the full thing the real skill requires: declines
          to add a parallel implementation, reuses/extends `withRetry`
          instead, and treats the cleaner-API wish as a separate proposed
          refactor. If this test STILL fails after the de-leak recorded in
          the header, the bare model refuses parallel builds unaided on a
          stimulus that no longer states the skill's conclusion — that is the
          finding. Do not redraft a third time: escalate it as the
          retire-or-keep decision the owner already made for semver-gate's
          and scope-fence's floors.
