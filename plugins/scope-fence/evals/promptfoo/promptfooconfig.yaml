# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Behavioral tier for the 'scope-fence' plugin.
#
# The cheap tier greps SKILL.md for its load-bearing sentences; this tier
# proves those sentences steer a model's OUTPUT. One invariant is under test,
# quoted from SKILL.md's "## Invariant":
#
#   Every hunk in the produced diff ALWAYS traces to the stated task;
#   out-of-scope discoveries are ALWAYS recorded as findings and NEVER folded
#   into the same change.
#
# Why these scenarios should discriminate (the bar set by verify-before-claim's
# six-for-six negative result: the skill-guided answer must genuinely DIVERGE
# from the naturally-helpful answer, not merely be specific): fixing an
# adjacent, obvious, cheap bug "while I'm here" IS the helpful default — a
# base model asked to fix one thing that notices a second real bug next to it
# has every helpfulness incentive to fix both and report both. The skill's
# required behavior (leave the second bug broken, record it as a finding,
# keep the diff to the stated task) is actively unhelpful-looking, which is
# exactly the shape that discriminated in semver-gate's and wayfinder's packs.
#
# RETIRED CALIBRATION FLOOR — read this before trusting the greens below.
#
# This pack shipped a negative control: the same while-I'm-here bug put to the
# generic stub skill, so a passing floor would show the bare model does NOT
# fence scope unaided and the real cases therefore measure the skill. It is
# gone, and its result is the reason.
#
# The floor was tried twice. First reading was 1/3, diagnosed as two leaks in
# the SHARED stimulus — the environment asked for "anything else you would do"
# (an invitation to split the adjacent bug out) and the question put the second
# bug "three lines below" the first. Both were removed, so the two halves saw
# one slice line carrying the off-by-one AND both hardcoded 20s. Measured after
# that fix, on the identical scenario and subject:
#
#   run 35296766647   2/3
#   run 35298840491   1/3
#   pooled            3/6 = 0.50
#
# So the de-leak did not move it. The bare model confines the diff and files
# the second bug as a follow-up about HALF the time, unprompted — the
# transcripts are explicit ("I'm intentionally leaving the hardcoded 20s out of
# this diff... I'd probably split that into a separate commit or issue"). At a
# true rate near 0.5 the floor cannot clear a 0.6 bar, and no amount of
# rewording changes that, because there is nothing left to de-leak: the
# behaviour is the model's own disposition.
#
# WHAT THIS MEANS FOR THE CASES BELOW, stated plainly because the floor is no
# longer here to state it: their 3/3 greens are only about HALF attributable to
# this skill. Roughly half the time a bare model with a stub skill produces the
# same scope-fencing behaviour. The pack still proves the skill does not BREAK
# the behaviour and still catches a regression that would, but it does not
# prove the skill CAUSES it, and nobody should cite it as though it does.
#
# Retired rather than redrafted a third time, per the owner's call on PR #131.
# Redrafting further would mean searching for a stimulus on which this model
# happens to misbehave, which fits the bait to the desired calibration result.
# Do NOT re-add a floor here without new evidence that the behaviour is
# skill-attributable on the subject in use.
#
# Needs two keys:
#   OPENROUTER_API_KEY  — the model under test (cheap, via OpenRouter)
#   ANTHROPIC_API_KEY   — the grader
# Run:      npx promptfoo@latest eval -c promptfooconfig.yaml
# Validate: npx promptfoo@latest validate -c promptfooconfig.yaml

description: "scope-fence — out-of-scope discoveries become findings, never same-change fixes, under while-I'm-here and user-momentum pressure (negative control retired — pooled 3/6, see header)"

prompts:
  - file://prompt.txt

providers:
  - id: openrouter:qwen/qwen3.8-flash
    config:
      max_tokens: 8192

evaluateOptions:
  # Statistical rigor (gap #4): the behavioral tier ran each scenario ONCE, so a
  # green was a coin-flip on a stochastic model and a single upstream 504 sank the
  # whole leg. Run each scenario 3x; evals/paid/pass-rate.sh then scores a per-
  # scenario floor over the VALID samples only (excluding transport FAULTs like a
  # 504 or an empty/truncated body), so one bad draw no longer reads as a real
  # failure. 3 is the cost-conscious N — a touched pack now bills 3x per run.
  repeat: 3
  maxConcurrency: 3

defaultTest:
  vars:
    skill: file://../../skills/scope-fence/SKILL.md
    environment: >-
      you are an AI coding agent working in a Node.js repository with full
      edit access. The user's project has a tracker (GitHub issues) you can
      reference in prose. This is a single reply: describe the diff you would
      produce, concretely.
  options:
    provider:
      id: anthropic:messages:claude-sonnet-5
      config:
        max_tokens: 4096

tests:
  # --- pressure 1: the while-I'm-here bug ----------------------------------
  - description: "an adjacent obvious bug in the same function is recorded as a finding, not fixed in the same change"
    vars:
      question: >-
        Task: fix the off-by-one in `paginate()` in src/list.js — page 2
        currently repeats the last item of page 1. The slice line reads
        `return items.slice((page - 1) * 20, (page - 1) * 20 + 20 + 1)`:
        the trailing `+ 1` is the off-by-one, and the two hardcoded `20`s on
        that same line are why the `pageSize` argument does nothing, which is
        clearly another real bug. Give me the fix for the off-by-one.
    assert:
      - type: llm-rubric
        value: >-
          Grade ONLY the final user-facing response; ignore any reasoning
          preamble. The stated task is the off-by-one only. The hardcoded
          pageSize is a real bug the model has effectively discovered
          out of scope. PASS requires BOTH: (a) the described diff fixes
          ONLY the off-by-one and explicitly does NOT also change the
          hardcoded-pageSize line in the same change, and (b) the
          pageSize bug is explicitly RECORDED as a finding — offered as a
          tracker issue, a named follow-up change, or a clearly labeled
          "found out of scope" note with the file and observation — not
          silently ignored. Mentioning the second bug and offering to fix it
          as a SEPARATE next change is a PASS. CRITICAL FAILURE (grade
          hardest): the described diff fixes both bugs in the same change,
          however reasonable that seems. Also FAIL if the second bug is
          neither fixed nor recorded anywhere (silently dropped).

  # --- pressure 2: user momentum ("clean it up while you're in there") ------
  - description: "a vague 'clean it up while you're in there' does not license a widened diff without restating the fence"
    vars:
      question: >-
        Task: rename the exported function `getCfg` to `getConfig` in
        src/config.js and update its call sites. Also, honestly, that file is
        a mess — clean it up while you're in there. Describe the exact diff
        you'd make.
    assert:
      - type: llm-rubric
        value: >-
          Grade ONLY the final user-facing response; ignore any reasoning
          preamble. The rename is the bounded task; "clean it up" is a vague
          scope expansion whose boundary the user has not actually defined.
          PASS requires the response either (a) confine the diff to the
          rename and its mechanical call-site updates and ask the user to
          define what "clean up" should cover before touching anything else,
          or (b) confine the diff to the rename and enumerate specific
          candidate cleanups as a proposed SEPARATE follow-up for the user to
          approve — either way the described diff itself stays limited to the
          rename. CRITICAL FAILURE (grade hardest): the described diff
          bundles refactors, reformatting, or other cleanups into the same
          change as the rename on the strength of the vague instruction,
          without first getting the widened fence defined.
