name: Fleet sync

# Deployed into the per-fleet playbook repo. ONE scheduled workflow, TWO jobs.
# The load-bearing split: `detect` is deterministic (no LLM credential) and
# auto-commits FACTS to main; `curate` runs the agent and opens a PR — it NEVER
# pushes to main. Facts auto-commit; interpretation is PR-only.

on:
  schedule:
    - cron: "17 6 * * *"      # daily
  workflow_dispatch: {}

concurrency:
  group: fleet-sync
  cancel-in-progress: false

jobs:
  # ---- deterministic, LLM-FREE. Writes trusted facts. -----------------------
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the facts manifest to main
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read fleet definition
        id: fleet
        run: |
          set -euo pipefail
          owner="$(yq -r '.owner' fleet.yaml 2>/dev/null || jq -r '.owner' fleet.yaml)"
          glob="$(yq -r '.glob' fleet.yaml 2>/dev/null || jq -r '.glob' fleet.yaml)"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "glob=$glob"   >> "$GITHUB_OUTPUT"
      - name: Enumerate fleet + stamp head_sha (the staleness clock)
        run: bash scripts/list-fleet-members.sh "${{ steps.fleet.outputs.owner }}" "${{ steps.fleet.outputs.glob }}" > new-manifest.json
      - name: Diff vs the committed manifest
        id: diff
        run: |
          set -euo pipefail
          bash scripts/diff-fleet.sh fleet-manifest.json new-manifest.json > diff.json
          changed="$(jq -r '.changed' diff.json)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Commit facts (manifest) to main — trusted, reproducible
        run: |
          set -euo pipefail
          mv new-manifest.json fleet-manifest.json
          git config user.name  "fleet-sync[bot]"
          git config user.email "fleet-sync@users.noreply.github.com"
          if git diff --quiet -- fleet-manifest.json; then
            echo "no fact change; recording a re-verified heartbeat in the changelog"
            date -u +'- %Y-%m-%dT%H:%M:%SZ no change; fleet re-verified' >> fleet-playbook/CHANGELOG.md
          fi
          # LAST-VERIFIED is a SEPARATE clock from last-curated. detect runs daily
          # and proves the fleet was re-read; curate only runs when something
          # changed. Collapsing both into one "freshness" stamp made the banner
          # wrong in both directions: a fleet that legitimately hadn't changed in
          # 45 days displayed a 45-day-old stamp telling readers to distrust a
          # playbook that was in fact verified this morning, while a playbook
          # rotting behind unmerged curate PRs looked fresh. Two clocks, two
          # truths.
          date -u +'%Y-%m-%dT%H:%M:%SZ' > fleet-playbook/LAST_VERIFIED
          git add fleet-manifest.json fleet-playbook/CHANGELOG.md fleet-playbook/LAST_VERIFIED
          git commit -m "detect: refresh fleet facts (changed=${{ steps.diff.outputs.changed }})" || echo "nothing to commit"
          # Push can legitimately fail if this repo later gains branch protection
          # on main. Say so in one unmistakable line rather than emitting a raw
          # git error into a log nobody reads — detect writing facts to main is a
          # load-bearing assumption of the whole design, so its failure must be
          # legible, not archaeological.
          git push origin HEAD:main || {
            echo "::error::detect could not push facts to main. If main is now branch-protected, this workflow's detect job needs a bypass or the design needs revisiting — facts auto-committing to main is load-bearing, not incidental."
            exit 1
          }

      # Backpressure: curate opens PRs; nothing here ever merged them. Facts kept
      # advancing on main daily while the playbook itself could sit months stale
      # behind a queue of unmerged curate PRs — with every workflow run green.
      # A stale-but-green pipeline is the exact failure this plugin exists to
      # prevent, so it now reports on itself.
      - name: Backpressure — warn if curation PRs are piling up unmerged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --state open --search 'head:curate/' --json number,createdAt --jq 'length' 2>/dev/null || echo 0)"
          if [ "${open_prs:-0}" -gt 0 ]; then
            oldest="$(gh pr list --state open --search 'head:curate/' --json createdAt --jq 'min_by(.createdAt).createdAt' 2>/dev/null || echo '')"
            echo "::warning::${open_prs} curation PR(s) open and unmerged (oldest: ${oldest:-unknown}). The facts manifest on main is current, but the PLAYBOOK is only as fresh as the last MERGED curation — readers are trusting stale prose."
          else
            echo "no unmerged curation PRs; playbook prose is as current as the last detected change"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with: { name: fleet-diff, path: diff.json }

  # ---- agentic. Reads only changed repos. Opens a PR. NEVER pushes to main. --
  curate:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # write to the PR branch only (not main)
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # LLM credential is scoped to THIS job only — the detector never sees it.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Swappable, cross-harness agent invocation. Default: Claude Code headless.
      AGENT_CMD: ${{ vars.FLEET_AGENT_CMD || 'claude -p' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: fleet-diff }
      - name: Gather context for ONLY the changed members
        run: bash scripts/gather-context.sh diff.json > context.json
      - name: Curate the playbook (edit, never regenerate)
        run: |
          set -euo pipefail
          # The agent reads PROMPT.md + context.json and edits fleet-playbook/*.
          # It must: cite every claim (repo@sha:path), append ONE changelog entry,
          # and touch only sections whose sources changed. It writes NOTHING to main.
          cat PROMPT.md context.json | $AGENT_CMD > /dev/null
      - name: Guard — every citation must be traceable (fail before the PR, not in review)
        run: |
          set -euo pipefail
          # Rejects the "cited-but-fabricated" failure mode: a claim naming a file
          # that was never read this pass (worst case, a removed member). If this
          # fails, the curation is discarded — it never reaches a PR.
          bash scripts/validate-citations.sh fleet-playbook/index.json diff.json context.json
      - name: Open a PR — never a direct push to main
        run: |
          set -euo pipefail
          branch="curate/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "fleet-curator[bot]"
          git config user.email "fleet-curator@users.noreply.github.com"
          git checkout -b "$branch"
          git add fleet-playbook/
          # A NO-OP MUST NOT LOOK LIKE A SUCCESS. Previously this line was
          # `|| { echo "no curation delta"; exit 0; }` — so an agent that ran and
          # silently produced nothing was indistinguishable from an agent that
          # correctly decided nothing needed changing, and both were
          # indistinguishable from an agent that never really ran. Green build,
          # no PR, no signal. That is precisely the failure mode this plugin was
          # built to eliminate, sitting inside the plugin itself.
          #
          # A zero delta after detect reported a real change is a LEGITIMATE
          # outcome (a member's head_sha can move without changing anything
          # playbook-worthy), so this does not fail the build — but it is now
          # recorded where a human will see it, and attributed to the specific
          # repos that changed.
          if ! git commit -m "curate: refresh fleet-playbook from detected changes"; then
            changed_repos="$(jq -r '[.members[]? | select(.changed == true) | .full_name] | join(", ")' diff.json 2>/dev/null || echo 'unknown')"
            echo "::notice::Curation ran and produced NO playbook change, though detect flagged: ${changed_repos}. Legitimate when a head_sha moved without changing anything playbook-worthy — but recorded here so 'the agent decided nothing' is never mistaken for 'the agent never ran'."
            date -u +"- %Y-%m-%dT%H:%M:%SZ curation ran, no playbook delta (changed: ${changed_repos})" >> fleet-playbook/CHANGELOG.md
            git add fleet-playbook/CHANGELOG.md
            git commit -m "curate: no delta, recorded" || true
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "curate: no playbook delta (audit trail)" \
              --body "detect flagged a change in \`${changed_repos}\`, but curation produced no playbook edit. Recorded rather than silently discarded, so a no-op is auditable. Close this if the no-op is correct." || true
            exit 0
          fi
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "curate: fleet-playbook update" \
            --body "Automated curation from a detected fleet change. The diff **is** the changelog — review that every new claim carries a repo@sha:path citation before merging."
